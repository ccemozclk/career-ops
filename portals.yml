# Portal Scanner Configuration
# Customized for Cem Ozcelik -- Senior Data Scientist / ML Engineer / Senior Data Analyst
#
# Strategy (3 levels):
#   1. Playwright -> careers_url of each company (real-time, reliable)
#   2. Greenhouse API -> structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    - "Senior Data Scientist"
    - "Staff Data Scientist"
    - "Principal Data Scientist"
    - "Lead Data Scientist"
    - "Senior ML Engineer"
    - "Staff ML Engineer"
    - "Senior Machine Learning Engineer"
    - "Data Scientist"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "MLOps"
    - "ML Platform"
    - "Applied Scientist"
    - "Applied ML"
    - "Computer Vision"
    - "Deep Learning"
    - "AI Engineer"
    - "Data Engineer"
    - "Senior Data Analyst"
    - "Analytics Engineer"
    - "Risk Scientist"
    - "Fraud Scientist"
    - "Quantitative Analyst"
    - "Datenwissenschaftler"
    - "Maschinelles Lernen"
  negative:
    - "Junior"
    - "Intern"
    - "Trainee"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Product Manager"
    - "Customer Success"
    - "Account Executive"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. The scanner extracts title, URL, and company.

search_queries:

  # -- Ashby -- DS/ML/DA roles --

  - name: Ashby -- Senior Data Scientist
    query: 'site:jobs.ashbyhq.com "Senior Data Scientist" OR "Staff Data Scientist" OR "Principal Data Scientist" remote'
    enabled: true

  - name: Ashby -- ML Engineer
    query: 'site:jobs.ashbyhq.com "ML Engineer" OR "Machine Learning Engineer" OR "MLOps Engineer" remote senior'
    enabled: true

  - name: Ashby -- Applied Scientist
    query: 'site:jobs.ashbyhq.com "Applied Scientist" OR "Research Scientist" OR "Applied ML" remote'
    enabled: true

  - name: Ashby -- Data Analyst Senior
    query: 'site:jobs.ashbyhq.com "Senior Data Analyst" OR "Lead Data Analyst" OR "Analytics Engineer" remote'
    enabled: true

  # -- Greenhouse -- DS/ML/DA roles --

  - name: Greenhouse -- Senior Data Scientist
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Data Scientist" OR "Staff Data Scientist" remote'
    enabled: true

  - name: Greenhouse -- ML Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "ML Engineer" OR "Machine Learning Engineer" OR "MLOps" remote senior'
    enabled: true

  - name: Greenhouse -- Computer Vision / Deep Learning
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Computer Vision" OR "Deep Learning" "Scientist" OR "Engineer" remote'
    enabled: true

  - name: Greenhouse -- Fintech Risk & Fraud DS
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Risk Scientist" OR "Fraud Scientist" OR "Credit Risk" "Data Scientist" remote'
    enabled: true

  # -- Workable -- DS/ML --

  - name: Workable -- Senior DS & ML
    query: 'site:apply.workable.com "Senior Data Scientist" OR "ML Engineer" OR "Machine Learning" remote'
    enabled: true

  # -- Lever -- DS/ML --

  - name: Lever -- Senior Data Scientist
    query: 'site:jobs.lever.co "Senior Data Scientist" OR "ML Engineer" OR "Machine Learning Engineer" remote'
    enabled: true

  # -- Remote boards -- DS/ML/DA --

  - name: Remotive -- Senior DS & ML
    query: 'site:remotive.com "Data Scientist" OR "ML Engineer" OR "Machine Learning" senior remote Europe OR US'
    enabled: true

  - name: WeWorkRemotely -- DS & ML
    query: 'site:weworkremotely.com "Data Scientist" OR "Machine Learning" OR "ML Engineer" senior'
    enabled: true

  - name: Working Nomads -- DS & ML
    query: 'site:workingnomads.com "Data Scientist" OR "ML Engineer" OR "Machine Learning Engineer"'
    enabled: true

  - name: RemoteOK -- DS & ML
    query: 'site:remoteok.com "Data Scientist" OR "ML Engineer" OR "Machine Learning" senior remote'
    enabled: true

  - name: Himalayas -- Senior DS & ML
    query: 'site:himalayas.app "Senior Data Scientist" OR "ML Engineer" OR "Machine Learning Engineer" Europe OR US OR remote'
    enabled: true

  # -- Specialized DS/ML boards --

  - name: ai-jobs.net -- Data Scientist
    query: 'site:ai-jobs.net "Data Scientist" OR "ML Engineer" OR "Applied Scientist" remote Europe OR US'
    enabled: true

  - name: EU Data Jobs -- DS/ML Europe
    query: 'site:eudatajobs.com "Data Scientist" OR "ML Engineer" OR "Machine Learning" remote Europe OR US'
    enabled: true

  - name: YC Jobs -- DS & ML
    query: 'site:workatastartup.com "Data Scientist" OR "ML Engineer" OR "Machine Learning" remote Europe OR US'
    enabled: true

  - name: Wellfound -- DS/ML
    query: 'site:wellfound.com "Senior Data Scientist" OR "ML Engineer" remote'
    enabled: true

  - name: Welcome to the Jungle -- DS/ML
    query: 'site:welcometothejungle.com "Data Scientist" OR "Machine Learning" remote'
    enabled: true

  # -- Domain-specific queries --

  - name: Industrial AI -- DS/ML roles
    query: '"predictive maintenance" OR "industrial AI" OR "manufacturing" "Data Scientist" OR "ML Engineer" remote OR Europe OR US'
    enabled: true

  - name: Fintech -- Risk & Fraud DS
    query: '"fraud detection" OR "credit risk" OR "financial risk" "Data Scientist" OR "ML Engineer" remote OR Europe OR US senior'
    enabled: true

  - name: Healthcare AI -- DS/Computer Vision
    query: '"medical AI" OR "healthcare AI" OR "computer vision" "Data Scientist" OR "ML Engineer" OR "Research Scientist" remote OR Europe OR US'
    enabled: true

  # -- Turkey local market --
  # LinkedIn site: search not reliable -- disabled

  - name: LinkedIn -- Turkey Senior DS
    query: 'site:linkedin.com/jobs "Senior Data Scientist" OR "ML Engineer" Istanbul OR Turkey remote'
    enabled: false

  - name: LinkedIn -- Turkey ML Engineer
    query: 'site:linkedin.com/jobs "Machine Learning Engineer" OR "MLOps" OR "Veri Bilimcisi" Istanbul OR Turkey'
    enabled: false

  # -- HN Who's Hiring -- DS/ML --

  - name: HN Who's Hiring -- DS & ML remote
    query: 'site:news.ycombinator.com "Data Scientist" OR "ML Engineer" OR "Machine Learning" remote'
    enabled: true

